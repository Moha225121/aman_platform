name: aman-platform
region: fra

envs:
  - key: APP_ENV
    value: production
    scope: RUN_TIME
  - key: APP_DEBUG
    value: "false"
    scope: RUN_TIME
  - key: APP_URL
    value: ${APP_URL}
    scope: RUN_TIME
  - key: APP_KEY
    value: REPLACE_WITH_GENERATED_APP_KEY
    type: SECRET
    scope: RUN_TIME
  - key: OPENAI_API_KEY
    value: REPLACE_WITH_OPENAI_API_KEY
    type: SECRET
    scope: RUN_TIME
  - key: OPENAI_MODEL
    value: gpt-5.6-sol
    scope: RUN_TIME
  - key: OPENAI_EMBEDDING_MODEL
    value: text-embedding-3-small
    scope: RUN_TIME
  - key: LOG_CHANNEL
    value: stderr
    scope: RUN_TIME
  - key: SESSION_DRIVER
    value: database
    scope: RUN_TIME
  - key: CACHE_STORE
    value: database
    scope: RUN_TIME
  - key: QUEUE_CONNECTION
    value: database
    scope: RUN_TIME
  - key: PDF_PYTHON_BINARY
    value: python3
    scope: RUN_TIME
  - key: AMAN_SEED_DATABASE
    value: "true"
    scope: RUN_TIME

services:
  - name: web
    github:
      repo: Moha225121/aman_platform
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    routes:
      - path: /
    health_check:
      http_path: /
